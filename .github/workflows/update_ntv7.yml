name: Update Tonton NTV7

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest    # Changed from ubuntu-latest to windows-latest

    env:
      TONTON_EMAIL: ${{ secrets.TONTON_EMAIL }}
      TONTON_PASSWORD: ${{ secrets.TONTON_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Run updater
        run: |
          python scripts/update_ntv7.py

      - name: Commit changes
        run: |
          git config user.name "Lee04049119"
          git config user.email "jianbiao0404@gmail.com"

          git add streams/ntv7.m3u

          git diff --cached --quiet || `
          git commit -m "Update NTV7 stream"

          git push

name: Update NTV7 Stream

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *'

jobs:
  update-stream:

    runs-on: ubuntu-latest
    env:
          TONTON_EMAIL: ${{ secrets.TONTON_EMAIL }}
          TONTON_PASSWORD: ${{ secrets.TONTON_PASSWORD }}

          

    steps:

      # ============================================
      # CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # SETUP PYTHON
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (Chromium + chromedriver)
        run: |
          sudo apt-get update -y
          # Install chromium and chromedriver so a compatible driver is available from PATH
          sudo apt-get install -y chromium-browser chromium-chromedriver wget gnupg2 ca-certificates unzip
          # show versions for debugging
          echo "=== chrome/chromium versions ==="
          google-chrome --version || true
          chromium-browser --version || true
          chromedriver --version || true
          # export chromedriver path to GITHUB_ENV so script can pick it up
          echo "CHROMEDRIVER_PATH=$(which chromedriver)" >> $GITHUB_ENV
          echo "BROWSER_PATH=$(which chromium-browser || true)" >> $GITHUB_ENV

      # ============================================
      # INSTALL PYTHON PACKAGES
      # ============================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found — installing minimal deps"
            pip install selenium webdriver-manager
          fi

      - name: Run Selenium script (🟢CLICK HERE TO VIEW RESULTS)
        env:
                  
          TARGET_URL: ${{ github.event.inputs.url }}
          MAX_WAIT_SECONDS: ${{ github.event.inputs.max_wait }}
          # CHROMEDRIVER_PATH set earlier; your script reads this to skip downloads
          CHROME_BIN: ${{ env.CHROME_BIN }}
          CHROMEDRIVER_PATH: ${{ env.CHROMEDRIVER_PATH }}
        run: |
          echo -e "Running Selenium Script with TARGET_URL=${TARGET_URL} and MAX_WAIT_SECONDS=${MAX_WAIT_SECONDS}"
          # make sure script is executable if needed
          ls -l
          python scripts/update_ntv7.py 2>&1 | tee fetch_stream_output.txt

      - name: Upload run log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetch-stream-log
          path: fetch_stream_output.txt
    

      # ============================================
      # SHOW GENERATED FILE
      # ============================================

      - name: Show generated M3U
        run: |
          echo "========== ntv7.m3u =========="
          cat streams/ntv7.m3u || true
          echo "=============================="

      # ============================================
      # COMMIT CHANGES
      # ============================================


      - name: Commit changes
        run: |
          git config user.name "Lee04049119"
          git config user.email "jianbiao0404@gmail.com"

          git add streams/ntv7.m3u

          git diff --cached --quiet || \
          git commit -m "Update NTV7 stream"

          git push

      # ============================================
      # UPLOAD ARTIFACT
      # ============================================

      - name: Upload M3U artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntv7-m3u
          path: streams/ntv7.m3u

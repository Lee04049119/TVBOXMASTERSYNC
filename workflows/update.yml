name: Update IPTV Malaysia Playlist

on:
  workflow_dispatch:
  schedule:
  - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest my.m3u
        run: |
          mkdir -p streams
          curl -L "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/my.m3u" -o streams/my.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streams/my.m3u

          git diff --cached --quiet || git commit -m "Auto update my.m3u"

      - name: Push changes
        run: git push
